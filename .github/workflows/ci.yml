name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # Testcontainers starts its own PostgreSQL against the runner's Docker daemon,
      # so the pipeline needs no service container of its own.
      - name: Run tests
        run: ./mvnw -B verify

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

      - name: Package
        run: ./mvnw -B -DskipTests package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: library-api-jar
          path: target/*.jar

  docker:
    name: Build container image
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: library-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up --build -d

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health/readiness | grep -q UP; then
              echo "API is up"; exit 0
            fi
            sleep 5
          done
          echo "API did not become ready in time"; docker compose logs api; exit 1

      - name: Exercise the happy path
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsS -u library-staff:staff-secret -X POST http://localhost:8080/oauth2/token \
            -d grant_type=client_credentials -d scope=library.api | jq -r '.access_token')
          AUTH="Authorization: Bearer ${TOKEN}"
          BORROWER=$(curl -fsS -X POST http://localhost:8080/api/v1/borrowers \
            -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"name":"CI Bot","email":"ci@example.com"}' | jq -r '.id')
          BOOK=$(curl -fsS -X POST http://localhost:8080/api/v1/books \
            -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"isbn":"9780132350884","title":"Clean Code","author":"Robert C. Martin"}' | jq -r '.id')
          curl -fsS -X POST "http://localhost:8080/api/v1/books/${BOOK}/borrow" \
            -H "$AUTH" -H 'Content-Type: application/json' -d "{\"borrowerId\":${BORROWER}}"
          curl -fsS -X POST "http://localhost:8080/api/v1/books/${BOOK}/return" \
            -H "$AUTH" -H 'Content-Type: application/json' -d "{\"borrowerId\":${BORROWER}}"

      - name: Tear down
        if: always()
        run: docker compose down -v
