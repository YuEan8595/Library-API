# One command to get the whole thing running:  docker compose up --build
#
# 12-Factor IV: PostgreSQL is an attached resource, reached purely through
# DATABASE_URL. Swap that URL for a managed instance and nothing else changes.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-library}
      POSTGRES_USER: ${POSTGRES_USER:-library}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-library}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-library} -d ${POSTGRES_DB:-library}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-library}
      DATABASE_USERNAME: ${POSTGRES_USER:-library}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-library}
      PORT: 8080
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
      OAUTH2_ISSUER_URI: ${OAUTH2_ISSUER_URI:-http://localhost:8080}
      LIBRARY_STAFF_CLIENT_SECRET: ${LIBRARY_STAFF_CLIENT_SECRET:-staff-secret}
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  pgdata:
