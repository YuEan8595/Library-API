# =============================================================================
# 12-Factor III (config): every value below is overridable by an environment
# variable, and nothing environment-specific is baked into the image.
#
# Syntax note: in a .properties file the first '=' separates key from value, so
# the colons inside ${DATABASE_URL:jdbc:postgresql://...} are part of the value
# and need no escaping. Spring still reads the first ':' in a placeholder as the
# "default value" separator, exactly as it does in YAML.
# =============================================================================

spring.application.name=library-api

# ----------------------------------------------------------------- datasource
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/library}
spring.datasource.username=${DATABASE_USERNAME:library}
spring.datasource.password=${DATABASE_PASSWORD:library}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DATABASE_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=10000

# ------------------------------------------------------------------ JPA
# No lazy loading in the view layer; keeps transaction boundaries explicit.
spring.jpa.open-in-view=false
# Flyway owns the schema; Hibernate only verifies that it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --------------------------------------------------------------- migrations
spring.flyway.locations=classpath:db/migration/postgresql
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ------------------------------------------------------------------- JSON
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------------------------------------------------------------- threading
spring.threads.virtual.enabled=${VIRTUAL_THREADS_ENABLED:true}

# ------------------------------------------------------------------ server
# 12-Factor VII (port binding)
server.port=${PORT:8080}
# 12-Factor IX (disposability)
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never

# ------------------------------------------------------------- actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

# ------------------------------------------------------------------ OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.oauth.client-id=library-staff

# --------------------------------------------------------------- OAuth2 / security
# This app is both the resource server and the authorization server (see the
# com.library.api.security package) - no external identity provider is required.
# OAUTH2_ISSUER_URI is only the "iss" claim value; token verification never makes a network
# call, so this is safe to leave pointing at the app's own external URL.
oauth2.issuer-uri=${OAUTH2_ISSUER_URI:http://localhost:8080}
oauth2.staff-client-secret=${LIBRARY_STAFF_CLIENT_SECRET:staff-secret}

# ------------------------------------------------------------------ logging
# 12-Factor XI: logs go to stdout as an event stream; the platform routes them.
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.library.api=${LOG_LEVEL_APP:INFO}
# %X{correlationId} pulls the per-request id the CorrelationIdFilter puts in the MDC, so
# every line a request produces carries the same id and one request can be grepped out of
# interleaved concurrent traffic. Set LOG_LEVEL_APP=DEBUG to see the LoggingAspect trace.
logging.pattern.level=%5p [${spring.application.name:},%X{correlationId:-}]
